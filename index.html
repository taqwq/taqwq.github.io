<title>taq</title>
<!-- タブの小さい絵：ラベンダーのキー1個（絵のファイルを置かずに、ここに書く） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='3' width='28' height='27' rx='7' fill='%23a993f5'/%3E%3Crect x='6' y='5' width='20' height='19' rx='5' fill='%23d6caff'/%3E%3C/svg%3E">

<style>
:root{--fg:#26232e;--sub:#716d84;--pad:32px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{color:var(--fg);font-family:"M PLUS 1 Code",monospace;font-synthesis:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.app{position:fixed;inset:0;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;padding-bottom:env(safe-area-inset-bottom,0px)}
/* キーボード。文字の層の後ろ */
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0;-webkit-tap-highlight-color:transparent}

/* 文字の層。位置は JS が決める。出す・消すは visibility だけ */
.name{position:absolute;left:var(--pad);top:var(--pad);margin:0;font-size:14px;font-weight:500;line-height:1;white-space:pre}
.label{position:absolute;left:0;top:0;font-size:12px;line-height:17px;white-space:nowrap;pointer-events:none;visibility:hidden}
/* 中身の白い所を押したら閉じたいので、当たるのは文字だけにする（白い所は canvas に通す）。文字は選べる */
.panel{position:absolute;left:0;top:0;margin:0;font-size:13px;line-height:22px;overflow-y:auto;user-select:text;-webkit-user-select:text;pointer-events:none;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#dcd9e5 transparent}
.panel .r,.panel .r *{pointer-events:auto}
/* 指で触る端末と phone の組み方：中身の箱そのものも触れるようにする（文字のすき間に指が乗っても、中で縦に動かせる）。
   （08 で直した：iPhone で favorites の下が見切れて、動かせなかった。箱が素通しだと、すき間に触れた指がキーボードの方へ抜けていた）
   この場合、中身の白い所を押しても閉じない。閉じるのは、中身の外の何もない所・同じキー */
[data-mode=phone] .panel{pointer-events:auto}
@media (hover:none){.panel{pointer-events:auto}}
.panel[hidden]{display:none}
@media (max-width:1199px){.panel{font-size:12px}.fav li>span{line-height:20px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.jp{font-size:.92em}

/* 中身の組み */
.panel p{margin:0}
.about p{font-size:14px}
.none,.a,.y,.d,.note,.fav .more>span{color:var(--sub)}
.panel .note{margin-top:18px}
[data-mode=phone] .panel .note{margin-top:16px}
.fav{display:flex;gap:48px;align-items:flex-start}
.fav h2{margin:0 0 14px;font:inherit;font-size:12px;line-height:17px;font-weight:400;color:var(--sub)}
.fav ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:max-content max-content max-content;column-gap:2.5ch}
.fav li{display:contents}
.fav li>span{line-height:22px;white-space:nowrap}
.t{font-weight:500}
.y{text-align:right;font-variant-numeric:tabular-nums}
.late{display:grid;grid-template-columns:max-content auto;column-gap:2ch}
.late>div{display:contents}
.handle{font-size:14px;color:var(--fg);text-decoration:none}
.hint{margin-left:2ch;font-size:12px;color:var(--sub)}
/* 幅の狭い PC：2群が横に並ばないので縦に積む */
[data-narrow="1"] .fav{flex-direction:column;gap:18px}
/* スマホ：群を縦に積む。入りきらないときは中で縦に動かす（スクロールバーは出さない） */
[data-mode=phone] .panel{scrollbar-width:none}
[data-mode=phone] .panel::-webkit-scrollbar{display:none}
[data-mode=phone] .fav{flex-direction:column;gap:16px}
[data-mode=phone] .fav>div{width:100%}
[data-mode=phone] .fav h2{margin-bottom:8px}
[data-mode=phone] .fav ul{grid-template-columns:minmax(0,1fr) 11.2em auto;column-gap:10px}   /* 作者の列は幅を決めて、2群でそろえる */
[data-mode=phone] .fav li>span{line-height:18px}
[data-mode=phone] .fav .t{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
[data-mode=phone] .fav .a{overflow:hidden;text-overflow:ellipsis}

/* 色のキーの配色の見比べ（仮。比べ終わったら消す）：今の番号。名前と同じ行の右端（キーボードに重ならない所）。数字を押しても切り替わる */
</style>

<body>
<main class="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <h1 class="name" id="name" aria-label="taq"></h1>
  <nav class="sr" id="sr" aria-label="sections">
    <button type="button" data-code="KeyA" aria-expanded="false">about</button>
    <button type="button" data-code="KeyF" aria-expanded="false">favorites</button>
    <button type="button" data-code="KeyL" aria-expanded="false">lately</button>
    <button type="button" data-code="KeyX" aria-expanded="false">x</button>
    <button type="button" data-code="KeyI" aria-expanded="false">instagram</button>
    <button type="button" data-code="KeyG" aria-expanded="false">github</button>
  </nav>
  <div class="label" id="label" aria-hidden="true"></div>
  <section class="panel" id="panel" hidden></section>
  <div class="sr" id="say" aria-live="polite"></div>
</main>
<!-- three.js が読めないなどで下の script が動かなかったときも、名前だけは出す -->
<script>setTimeout(function(){if(!window.T){var n=document.getElementById('name');if(n&&!n.textContent)n.textContent='taq'}},4000)</script>

<script type="module">
import * as THREE from 'three';

const qs=new URLSearchParams(location.search);
const $=s=>document.querySelector(s);
const D=Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const inOut=t=>t*t*(3-2*t),outQ=t=>1-(1-t)*(1-t);
const B3=(u,a,b)=>3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*b+u*u*u;
// cubic-bezier(x1,y1,x2,y2)。x から y を二分探索で求める
const bez=(x1,y1,x2,y2)=>t=>{if(t<=0)return 0;if(t>=1)return 1;let a=0,b=1,u=t;for(let i=0;i<30;i++){u=(a+b)/2;if(B3(u,x1,x2)<t)a=u;else b=u}return B3(u,y1,y2)};
const touchy=matchMedia('(hover:none)').matches;

/* ---------- 設定 P（見た目と動きの数字はすべてここ。変えたら T.refit()） ---------- */
const P=window.P={
  // 色のキー6個：キーごとに [キーの色, 画面の言葉の色, キーの上の印字の色（なければ言葉の色）]
  // 決まった配色（taq、2026-11-17）：10 の 3（類似色相）を、11 の 2（白を少し混ぜる）のトーンで
  //   ・色相：343・323・303・283・263・243（a x f g i l の並び。場面の影のラベンダー 293° を中心に 20° ずつ。ピンク → 藤 → ラベンダー → 青）
  //   ・明るさ：色相ごとの「自然な明るさ」（その色相で画面がいちばん鮮やかに出せる色の明るさを 0.2 倍に縮めて足す）に、白を 2 割混ぜた。見える明るさ .87〜.91、鮮やかさ .048
  //   ・画面で合わせた：キーの上面の見える色が目標になるように、入れる色を直した（design/tools/pale.py → calib.js）。だから値は不ぞろいに見える。
  //     l（いちばん淡い空色）は、入れる色の青が上限で、見える色相が 6° ほど水色の側にずれる
  //   ・言葉と印字：同じ色相の暗い色（OKLCH の明るさ .46）
  //   （経緯：04〜11 の候補は index-v04.html〜index-v11.html と design/decisions.md）
  keys:{KeyA:['#e6c0d6','#7d3f67'],KeyX:['#c8b1cc','#724378'],KeyF:['#c4b7d7','#634986'],KeyG:['#babcdd','#514f8e'],KeyI:['#b8cbed','#3a5690'],KeyL:['#c1e7ff','#175d8b']},
  legend:'#6b677e',
  // 材質 [色, 粗さ]。metalness はどれも 0
  // （ケースはキーより一段暗くする。白い背景の上で輪郭が出て、白いキーが浮く。試作の「白いキーと灰色の板」の関係）
  // （軸と箱：外したときに見える。ラベンダーの十字と、ラベンダーがかった乳白の箱）
  // （tint＝色のキー。色は配色から。3つ目は、自分でも光る強さ：光らせないと、陰の面が地面の紫の光で濁る（オレンジは茶色、ミントは灰緑に見えた）。
  //   .12 で、陰の面と上の面の明るさの差が、白いキーと同じくらいになる）
  mat:{key:['#f6f6f9',.62],tint:[null,.6,.12],case:['#e6e5ee',.5],well:['#cfcbe0',.8],button:['#efeef5',.35],lamp:['#c3bed8',.6],box:['#e4e0f4',.35],cross:['#a993f5',.4],inner:['#dcd8ea',.6],
       foot:['#c9c4dc',.9],leg:['#dcd9e8',.7],port:['#bdb7d2',.6],portIn:['#9e97bb',.7]},   // 底のゴム足、たたんだ脚、奥の口
  // 井戸の底の暗がり
  ao:1,aoColor:'#8f84b8',aoAlpha:.35,aoTint:.5,aoBlur:3,
  // 光
  // （光は左奥の上から。影は手前に落ち、キーの手前の面が影になる。その影に、地面の色で紫を足す。試作の光は [-240,520,200]）
  env:.48,sun:[-220,560,-160],sunPower:2.4,hemi:['#ffffff','#b9a8ff',.6],under:['#f3f0ff',1.5],exposure:1,
  shadowMap:4096,shadowSizes:[4096,2048],shadowBias:-.0003,shadowNormalBias:.4,   // 影の地図：[PC, スマホやタッチの端末]。画面の大きさが決まるたびに選び直す
  // 床の影（ぼかした面を2枚）と、床のキャップの影
  floor:[{color:'#b79cff',blur:46,alpha:.46,dx:16,dz:22},{color:'#6a55c8',blur:9,alpha:.28,dx:4,dz:6}],
  capShadow:{color:'#6a55c8',alpha:.35,size:26,fade:40,grow:30},
  // ケース
  caseR:6,caseBevel:1,wellPad:1.2,wellR:2.5,wellBevel:.6,wellY:-4.2,
  // キーの形。ring は [h に掛ける, 足す, 内側への寄せ, 角の丸み]
  ring:[[0,0,0,1.6],[.55,0,1,1.9],[1,-.8,1.9,2.2],[1,-.3,2.1,2.3],[1,-.07,2.35,2.4],[1,0,2.65,2.5]],
  gap:.95,back:.6,seg:6,dish:.12,dishEdge:6,sculpt:1,flatH:7.9,capsLow:4.6,capY:-.4,wall:1.2,
  rows:[[9,7],[8.6,5],[7.9,2],[7.5,0],[7.7,-3],[7.7,-6]],   // 段ごとの [高さ h, 傾き°]
  // 印字
  // 印字の書体は M PLUS 2（画面の文字 M PLUS 1 Code と同じ系統のゴシック）。等幅だと「コードの文字」に見えたので替えた。
  // ほかの候補は URL の ?legend=code|outfit|barlow|round で見比べられる（下の LEGENDS。書体と太さだけを替える）
  // 置き方（px。1マス cell）：1文字 one・矢印 arrow は中央（oneDy 下へ）。2段は素の文字 two を中心から twoGap 下、Shift の文字 twoS を twoGap 上（不透明度 shiftA）。
  // 言葉は word。幅 1u のキーは下の中央、幅の広いキーは左半分なら左下・右半分なら右下の隅（端から mx、下端から mb が文字の下端）
  font:{family:'M PLUS 2',weight:500,one:80,oneDy:4,arrow:74,two:54,twoS:44,twoGap:32,shiftA:.6,word:34,mx:28,mb:30,cell:192},
  // カメラ。phone の組み方（キーボードを下に大きく、横に動かして見る）は、幅が phoneBelow より狭くて、縦長か正方形のときだけ。
  // （横向きのスマホ（667×375 など）を phone で組むと、キーボードが画面の高さをほぼ全部使い、中身の入る高さが 0 になった。横長なら pc で組む）
  phoneBelow:700,pad:[32,20],labelH:17,
  // narrow：この幅より狭い PC は favorites を縦に積む。short：この高さより低い画面（横向きのスマホなど）も縦に積む
  // （低い画面では、中身とキーボードが縦に入りきらない。縦に積むと中身の幅が半分になって、キーボードが右へよけられる。積まないと、下へ押し出されて見えなくなった）
  pc:{fov:20,el:54,yaw:-5,frac:[.86,.68],maxH:.5,bottom:[64,.083],sway:[1.6,.8],dead:.12,follow:380,back:200,narrow:780,short:560},
  // （bottom を小さくして、キーボードを画面の下いっぱいに寄せる。上の白が広がって、375×812 でも favorites が中で動かさずに入る）
  phone:{fov:24,el:62,yaw:0,u:[9.4,38,48],bottom:24,start:6.25,edge:[4,12],hitY:7.7,near:.62},
  // キーのばね（ms と mm）
  spring:{down:[.03,.3],up:[.012,.15],wideDown:.0225,wideUp:.009,travel:3.3,latch:1.5,armed:.6,hover:.4},
  // パン（px と ms）
  pan:{slop:8,vel:80,vmax:3,tau:325,stop:.02,rubber:.35,max:28,k:.004,c:.12},
  // 時間（ms）
  time:{hover:120,again:300,show:50,row:22,opened:600,second:250,tap:120,watch:3000,sr:120},
  // 開いたときの動き。letters：名前の1文字目・2文字目・3文字目が出る ms（4文字目からは同じ間隔）。キーボードのキーは打たない
  intro:{fade:420,fadeEase:[.2,.7,.3,1],letters:[220,350,480],pan:650,panFrom:24,panEase:[.25,.8,.25,1],end:720,
         view:{yaw:-10,el:4,zoom:.94,ms:700,ease:[.2,.7,.2,1]}},   // pc だけ：ホームから yaw −10°、el +4°、zoom .94 で始めて、ホームへ
  // 視点（° と ms と px）。回す：1px で orbit°。慣性：直前 vel ms の速さ（上限 vmax °/ms）を exp(−t/tau) で減らし、stop °/ms で止める
  // zoom：[pc, phone] の範囲。wheel：deltaY 1 あたり。wheelTau：寄るなめらかさ。home：戻る ms。again：2回押しの ms。key：キーで回す °/ms
  // keyZoom：PageUp/Down の速さ。under：End で見る el。pinchEl：2本指の上下 1px の °。tol：ホームの判定 [°, zoom, mm, 画面の上でのずらし px]。shade：床の影を消す el [0, 1]
  // （メインの調整：vmax を .84 → .3。速く払っても 80° ほどで止まる。flingEl：縦の惰性は半分。
  //   矢印キーは、keyDelay ms 押し続けてから keyRamp ms かけて回り始める＝軽く叩いただけでは回らない。keyTau：キーを離したあとの惰性）
  // margin：注視点の動ける範囲（ケースと床のキャップの外へ mm）。slop は右ボタンで動かしたとみなす距離（右クリックのメニューを出さない）も兼ねる
  // keep：画面の上でずらしても（ox・oy）、キーボードが画面の中にこれだけは残る（px）
  view:{slop:6,orbit:.28,vel:80,tau:280,stop:.002,vmax:.3,flingEl:.5,el:[-78,88],zoom:{pc:[.5,3.2],phone:[.42,2.6]},margin:60,keep:120,
        wheel:.0016,wheelTau:110,home:520,homeEase:[.3,.7,.2,1],again:350,key:.085,keyDelay:140,keyRamp:220,keyTau:150,keyZoom:.0011,under:-58,pinchEl:.25,
        tol:[.4,.008,1,.5],shade:[3,14]},
  // つかんだ ↑ のキャップ（mm と ms）。desk/over：運ぶ高さ（机から／ケースの上面から）。grow：ケースの上とみなす広がり。hTau：高さの切り替わり
  // w：位置のばね（臨界減衰、/ms）。flip：表に返す ms。tilt：[1 mm/ms あたりの °, 最大 °, 時定数 ms]。box：動ける範囲 [x−, x+, z−, z+]（ケースの縁から）
  // snap：軸に吸いつく距離（u）。above：吸いついたときの高さ（はまる位置から）。seat：押し込む ms。vel：投げる速さを見る ms。vmax：速さの上限
  // lead：着地点の先読み ms。fly：[最短 ms, 1mm あたり, 最長]。apex：[足す mm, 速さ 1 あたり]
  // flipV：裏返す速さ。spin：[°, 速さ 1 あたり °]。bounce：[mm, ms]。still：動きを減らす設定で置く ms。dip：はまったときの沈み
  // 着地点は box の中ならどこでもよい（キーボードの上・奥も）。高さは真下の面：foot（足元の四角の半分 mm）に重なるキーのいちばん高い上面、
  // キーがなければケースの上面（0）、ケースの外は床。stem：むき出しの ↑ の軸の高さ
  carry:{desk:20,over:30,grow:20,hTau:90,w:.03,flip:160,tilt:[14,16,70],box:[-110,150,-90,110],snap:.62,above:7,seat:90,yawTau:90,
         vel:80,vmax:1.4,lead:170,fly:[240,1.1,560],apex:[5,8],flipV:.28,spin:[30,50],bounce:[1.2,90],still:120,dip:.6,foot:8,stem:4.8},
  // 押した所に合わせたキーの傾き（°）：[ふつう, 幅 2u 以上]。沈みの深さに比例
  tilt:[1.8,1],
  // 細部：スイッチの箱 [幅, 上の y]、底の縁の丸み、合わせ目の溝 [y, 深さ, 幅]、ゴム足、たたんだ脚、奥の口、丸いボタンの沈み、ランプ [色, 強さ]
  model:{boxW:14,boxTop:.8,bottomR:1.2,seam:[-6,.45,.5],foot:{size:[26,9],h:.9,at:[24,12]},leg:{size:[38,16],r:3,at:[60,16]},
         port:{y:-8,outer:[16,7,2],inner:[8.5,2.8,1]},button:.9,lamp:['#59eab6',1.6]},
  // ↑ のキャップ
  cap:{place:[34,8],yaw:23,wobble:[-5,4,-2,6],on:520,seat:[60,2],peak:34,peakAt:.42,turn:[.1,.75],ease:[.3,0,.2,1],   // peak：裏返しのまま → キーの上を通るので、少し高めに
       off:[70,380,90],lift:9,arc:14,bounce:1.2,still:120},
  // 中身の出し方「紙」（px）：名前の下端 + top にラベル、gap あけて中身。hover：カーソルを乗せたときの言葉の不透明度
  // 中身の高さの上限：pc は H − 上端 − pad。phone はホームの向きでのキーボードの上端 − dodge.m − 上端
  // zone：pc のキーボードの大きさ。ホームの向きで、キーボードの上端が 名前の下端 + top + labelH + gap + zone [ふつう, 縦に積むとき] + dodge.m より下に来る
  paper:{top:20,gap:14,hover:.45,zone:[232,402]},
  // よける（px と ms）：中身（ラベルと中身の四角）を m [pc, phone] 広げた四角とキーボードが重なったときだけ、下か右へ動かす。
  // m は、ホームの向きでの文字とキーボードのすき間でもある（pc は fit がこのぶんの白を残し、phone は中身の高さの上限をこのぶん手前で止める）。
  // だから、ホームの向きでは、どの中身を開いてもよけない。
  // 動かしたあと、キーボードの下端・右端が画面の端から edge 以内なら使える。ms かけて動かす（曲線は view.homeEase）
  dodge:{m:[24,12],edge:8,ms:320}

/* ---------- 中身 ---------- */

  const d=empty();d.name='';let sec=null;

function fling(tr,t,cancel){

  Promise.all([legLoad,document.fonts.load('400 13px "M PLUS 1 Code"'),document.fonts.load('500 14px "M PLUS 1 Code"')]),
  new Promise(r=>setTimeout(r,1500))]).catch(()=>{});

  .catch(e=>{console.warn('content.txt を読めなかった。名前だけで動かす',e);return empty()});
// 中身が遅いときも 1.5 秒で先へ進む（キーボードと名前を先に出す）。届いたら入れ替える
const firstContent=Promise.race([content,new Promise(r=>setTimeout(()=>r(null),1500))]);

applyLook();buildCase();buildKeys();loadCap();drawAO();drawFloor();fit();   // loadCap：前に来たときのキャップの置き場所（キャップの形ができてから）

  drawLegends();apply();ready=true;fit();render();
  if(introOn&&!still&&!touched)startIntro();else finishIntro();
  wake();
  if(!d)content.then(late=>{useData(late);if(!intro)nameEl.textContent=DATA.name;wake()});
  // 印字の書体が 1.5 秒に間に合わなかったときのために、読めたらもう一度描く（間に合っていれば、同じ絵を描き直すだけ）
  legLoad.then(()=>{drawLegends();wake()});
  document.fonts.ready.then(()=>{placePanel();updLabel();wake()});
});
</script>
